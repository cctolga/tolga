# Windows installer (Tolga-Player-Win.exe) and zip, cross-compiled on Linux with MinGW-w64.
# A tag v* attaches them to that release; a manual run keeps them as a workflow artifact.
name: Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build tools and the MinGW cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64-posix mingw-w64-tools \
            nasm pkg-config ninja-build cmake nsis zip python3-pip curl autoconf automake libtool
          pip3 install --user --break-system-packages "meson>=1.6,<2"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache LGPL libraries
        uses: actions/cache@v4
        with:
          path: |
            deps/windows-x86_64
            deps/src
          key: deps-windows-x86_64-mingw-${{ hashFiles('scripts/build-deps.sh') }}

      - name: LGPL libraries (mpv, FFmpeg, ...)
        env:
          TOLGA_TARGET: windows
          # uchardet (subtitle charset detection) isn't cross-built yet; subtitles default to cp1254/UTF-8
          TOLGA_SKIP_UCHARDET: "1"
        run: scripts/build-deps.sh

      - name: OpenSubtitles key (repository secret OPENSUBTITLES_KEY)
        env:
          KEY: ${{ secrets.OPENSUBTITLES_KEY }}
        run: |
          if [ -n "$KEY" ]; then printf '%s' "$KEY" > opensubtitles.key
          else echo "::warning::OPENSUBTITLES_KEY secret missing: online subtitle search needs the user's own key"; fi

      - name: Installer and zip
        env:
          # a release must have AirPlay (the prebuilt module for Windows has to be published first)
          TOLGA_REQUIRE_AIRPLAY: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '' }}
        run: scripts/make-windows.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Tolga-Player-Win
          path: |
            dist/Tolga-Player-Win.exe
            dist/Tolga-Player-Win.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --draft --title "Tolga Player ${TAG#v}" --notes "Tolga Player ${TAG#v}"
          gh release upload "$TAG" dist/Tolga-Player-Win.exe dist/Tolga-Player-Win.zip --clobber
          # The release stays a draft (so the site's download links never point at missing files)
          # until every download is attached; whichever job finishes last publishes it.
          names=$(gh release view "$TAG" --json assets -q '.assets[].name')
          for f in Tolga-Player-Mac.dmg Tolga-Player-Win.exe Tolga-Player-Win.zip \
                   Tolga-Player-Linux.AppImage Tolga-Player-Linux.AppImage.zsync; do
            if ! printf '%s\n' "$names" | grep -qx "$f"; then
              echo "not publishing yet: $f is missing"
              exit 0
            fi
          done
          gh release edit "$TAG" --draft=false --latest
          echo "published $TAG"

  # Microsoft Store package, made from the same program folder. Needs the repository variables
  # MSIX_IDENTITY_NAME, MSIX_PUBLISHER and MSIX_PUBLISHER_NAME (Partner Center > Product
  # identity); without them it is skipped. The .msix is a workflow artifact, uploaded to
  # Partner Center by hand; it is not attached to the release.
  msix:
    needs: windows
    if: vars.MSIX_IDENTITY_NAME != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Tolga-Player-Win
          path: dist

      - name: MSIX
        shell: pwsh
        run: >
          scripts/make-msix.ps1 -Zip dist/Tolga-Player-Win.zip
          -IdentityName "${{ vars.MSIX_IDENTITY_NAME }}"
          -Publisher "${{ vars.MSIX_PUBLISHER }}"
          -PublisherName "${{ vars.MSIX_PUBLISHER_NAME }}"

      - uses: actions/upload-artifact@v4
        with:
          name: Tolga-Player-Win-msix
          path: dist/Tolga-Player-Win.msix
